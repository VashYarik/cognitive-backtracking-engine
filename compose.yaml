# Local PostgreSQL for development. Start: docker compose up -d   Stop: docker compose down
# Values come from .env (copy .env.example to .env and set your own password).
services:
  db:
    # Exact version, so every setup runs the same PostgreSQL.
    image: postgres:18.6
    environment:
      # ":?" makes Compose stop with this message if the value is missing,
      # instead of starting a database with an empty password.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1 only: reachable from this computer, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql
      # (checked with: docker image inspect postgres:18.6).
      - cbe-db-data:/var/lib/postgresql

volumes:
  cbe-db-data:
